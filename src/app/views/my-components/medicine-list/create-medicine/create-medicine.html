<app-bread-crumb />

<app-ui-card title="Create Medicine">
      <a
        helper-text
        href="/medicine-list"
        class="icon-link icon-link-hover link-secondary link-underline-secondarlink-secondary link-underline-opacity-25 fw-semibold"
        >Medicine List
        <ng-icon name="tablerArrowRight" class="bi fs-lg" />
      </a>
      <form
        card-body
        class="row g-3 needs-validation"
        novalidate
        (ngSubmit)="validSubmit()"
        [formGroup]="validationform"
      >
        <div class="col-md-4">
          <label for="validationCustom01" class="form-label">Medicine</label>
          <input
            type="text"
            class="form-control"
            id="validationCustom01"
            required
            formControlName="medicineName"
            placeholder="Medicine Name"
            [class]="submit && !form['medicineName'].errors ? 'is-valid' : ''"
          />
          <div class="valid-feedback">Looks good!</div>
        </div>

        <div class="col-md-4">
          <label for="validationCustom02" class="form-label">Generic</label>
          <input
            type="text"
            class="form-control"
            id="validationCustom02"
            formControlName="genericName"
            placeholder="Generic Name"
            [class]="submit && !form['genericName'].errors ? 'is-valid' : ''"
            required
          />
          <div class="valid-feedback">Looks good!</div>
        </div>

        <div class="col-md-4">
          <label for="validationCustom02" class="form-label">Category</label>
          <input
            type="text"
            class="form-control"
            id="validationCustom02"
            formControlName="categoryName"
            placeholder="Category Name"
            [class]="submit && !form['categoryName'].errors ? 'is-valid' : ''"
            required
          />
          <div class="valid-feedback">Looks good!</div>
        </div>

        <div class="col-md-4">
          <label for="validationCustom02" class="form-label">Brand</label>
          <input
            type="text"
            class="form-control"
            id="validationCustom02"
            formControlName="brandName"
            placeholder="Brand Name"
            [class]="submit && !form['brandName'].errors ? 'is-valid' : ''"
            required
          />
          <div class="valid-feedback">Looks good!</div>
        </div>

        <div class="col-md-4">
          <label for="validationCustom02" class="form-label">Batch</label>
          <input
            type="text"
            class="form-control"
            id="validationCustom02"
            formControlName="batchNumber"
            placeholder="Batch Number"
            [class]="submit && !form['batchNumber'].errors ? 'is-valid' : ''"
            required
          />
          <div class="valid-feedback">Looks good!</div>
        </div>

        <div class="col-md-4">
          <label for="mfgDate" class="form-label">MFG Date</label>
          <input
            type="date"
            class="form-control"
            id="mfgDate"
            formControlName="mfgDate"
            [class]="submit && !form['mfgDate'].errors ? 'is-valid' : ''"
            required
          />
          <div class="valid-feedback">Looks good!</div>
        </div>

        <div class="col-md-4">
          <label for="barcode" class="form-label">Barcode</label>
          <input
            type="text"
            class="form-control"
            id="barcode"
            formControlName="barcode"
            placeholder="Barcode"
            autocomplete="off"
            [class]="submit && !form['barcode'].errors ? 'is-valid' : ''"
            required
          />
          <div class="valid-feedback">Looks good!</div>
        </div>

        <div class="col-md-4">
          <label for="medicineImage" class="form-label">Image</label>
          <input
            type="file"
            class="form-control"
            id="medicineImage"
            #medicineImageInput
            accept="image/*"
            (change)="onImageSelected($event)"
            [class]="submit && !form['medicineImage'].errors ? 'is-valid' : ''"
            required
          />
          <div class="form-text">Upload an image of the medicine.</div>
          <button
            type="button"
            class="btn btn-outline-secondary btn-sm mt-2"
            [disabled]="!form['medicineImage'].value"
            (click)="cancelImageUpload(medicineImageInput)"
          >
            Cancel Image
          </button>
          <div class="valid-feedback">Looks good!</div>
        </div>

        <div class="col-md-4">
          <label for="mfgDate" class="form-label">EXP Date</label>
          <input
            type="date"
            class="form-control"
            id="expDate"
            formControlName="expDate"
            [class]="submit && !form['expDate'].errors ? 'is-valid' : ''"
            required
          />
          <div class="valid-feedback">Looks good!</div>
        </div>

        <div class="col-md-4">
          <label for="validationCustom02" class="form-label">Quantity</label>
          <input
            type="number"
            class="form-control"
            id="validationCustom02"
            formControlName="quantity"
            placeholder="Quantity"
            [class]="submit && !form['quantity'].errors ? 'is-valid' : ''"
            required
          />
          <div class="valid-feedback">Looks good!</div>
        </div>

        <div class="col-md-4">
          <label for="validationCustom02" class="form-label">Purchase Price</label>
          <input
            type="number"
            class="form-control"
            id="validationCustom02"
            formControlName="purchasePrice"
            placeholder="Purchase Price"
            [class]="submit && !form['purchasePrice'].errors ? 'is-valid' : ''"
            required
          />
          <div class="valid-feedback">Looks good!</div>
        </div>

        <div class="col-md-4">
          <label for="validationCustom02" class="form-label">Selling Price</label>
          <input
            type="number"
            class="form-control"
            id="validationCustom02"
            formControlName="sellingPrice"
            placeholder="Selling Price"
            [class]="submit && !form['sellingPrice'].errors ? 'is-valid' : ''"
            required
          />
          <div class="valid-feedback">Looks good!</div>
        </div>

        <div class="col-md-4">
          <label for="validationCustom02" class="form-label">Description</label>
          <textarea
            class="form-control"
            id="example-textarea"
            rows="3"
            formControlName="description"
            placeholder="Description"
            [class]="submit && !form['description'].errors ? 'is-valid' : ''"
          ></textarea>
        </div>

        <!-- <div class="col-12">
          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              value=""
              id="invalidCheck"
              required
            />
            <label class="form-check-label" for="invalidCheck">
              i agree to the terms and conditions
            </label>
            <div class="invalid-feedback">
              You must agree before submitting.
            </div>
          </div>
        </div> -->


        <div class="col-12">
          <button class="btn btn-primary" type="submit">Save</button>
        </div>
      </form>
</app-ui-card>
